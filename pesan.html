<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan - Kafe ASSOR</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="img/logo-assor.png" alt="Logo Kafe ASSOR" width="80">
    <h1>Kafe ASSOR</h1>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="menu.html">Menu</a>
      <a href="pesan.html">Pesan</a>
      <a href="kontak.html">Kontak</a>
    </nav>
  </header>
  <main>
    <h2>Form Pemesanan</h2>
    <form id="formPesan" action="#" method="post">
      <label for="nama">Nama</label>
      <input type="text" id="nama" name="nama">
      <small class="error" id="errNama"></small>
      <label for="hp">No. HP</label>
      <input type="tel" id="hp" name="hp">
      <small class="error" id="errHp"></small>
      <label for="meja">No. Meja</label>
      <select id="meja" name="meja">
        <option value="">-- Pilih --</option>
        <option value="1">Meja 1</option>
        <option value="2">Meja 2</option>
        <option value="3">Meja 3</option>
        <option value="4">Meja 4</option>
        <option value="5">Meja 5</option>
      </select>
      <small class="error" id="errMeja"></small>
      <label for="menu">Menu</label>
      <select id="menu" name="menu">
        <option value="25000">Nasi Goreng Kampung - 25000</option>
        <option value="35000">Ayam Bakar Papua - 35000</option>
        <option value="22000">Mie Goreng Spesial - 22000</option>
        <option value="20000">Kopi Susu - 20000</option>
        <option value="8000">Es Teh Manis - 8000</option>
        <option value="18000">Jus Alpukat - 18000</option>
      </select><br>
      <label for="jumlah">Jumlah</label>
      <input type="number" id="jumlah" name="jumlah" value="1">
      <small class="error" id="errJumlah"></small>
      <p>Total: <b id="total">Rp25.000</b></p>
      <label>Penyajian</label>
      <input type="radio" name="saji" value="makan-di-tempat" checked> Makan di tempat
      <input type="radio" name="saji" value="dibawa-pulang"> Dibawa pulang<br>
      <label for="catatan">Catatan</label>
      <textarea id="catatan" name="catatan"></textarea><br>
      <button type="submit">Pesan</button>
    </form>
    <p id="pesanSukses"></p>
  </main>
  <footer>&copy; 2026 Kafe ASSOR</footer>
  <script src="js/app.js"></script>
</body>
</html>
